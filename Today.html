<body>

    <canvas id="petalsCanvas"></canvas>

    <div class="main-container">
        <div class="card" id="card">
            <span class="sparkle" style="top:8%;left:8%;animation-delay:0s;">✨</span>
            <span class="sparkle" style="top:12%;right:10%;animation-delay:0.8s;">🌸</span>
            <span class="sparkle" style="bottom:18%;left:12%;animation-delay:1.6s;">💫</span>
            <span class="sparkle" style="bottom:10%;right:14%;animation-delay:2.2s;">🌷</span>
            <span class="sparkle" style="top:40%;left:5%;animation-delay:0.4s;font-size:15px;">🌟</span>
            <span class="sparkle" style="top:45%;right:6%;animation-delay:2.8s;font-size:16px;">💖</span>

            <div class="flower-bouquet">💐</div>

            <h1 class="title">
                妈妈，母亲节<span class="accent">❤️</span>快乐
            </h1>
            <p class="subtitle">—— 儿子献给最爱的母亲 ——</p>

            <div class="divider">
                <span class="line"></span><span class="dot"></span><span class="line"></span>
            </div>

            <div class="message">
                <span class="typewriter-line" id="line1"></span>
                <span class="typewriter-line" id="line2"></span>
                <span class="typewriter-line" id="line3"></span>
            </div>
            <p class="message" style="margin-top:4px;">
                <span class="highlight">妈妈，您辛苦了！</span><br>
                愿时光温柔，岁月长留<br>
                愿您永远健康、幸福、美丽 💕
            </p>
            <p class="signature">—— 永远爱您的儿子</p>

            <div class="btn-row">
                <button class="btn btn-primary" onclick="sendLove()">
                    💌 给妈妈一个拥抱
                </button>
                <button class="btn btn-secondary" onclick="playMusic()">
                    🎵 播放温馨旋律
                </button>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="none">
        <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_c6c8f33e27.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==================== 花瓣画布 ====================
        const canvas = document.getElementById('petalsCanvas');
        const ctx = canvas.getContext('2d');

        let petals = [];
        const maxPetals = 55;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            petals.forEach(p => {
                if (p.x > canvas.width) p.x = Math.random() * canvas.width;
                if (p.y > canvas.height) p.y = Math.random() * canvas.height;
            });
        });

        const petalColors = [
            '#f4c2d7', '#f8d4e4', '#fadde8', '#fbe8ef',
            '#e8a0bf', '#f0b8cf', '#fce4ec', '#fff0f3',
            '#ffd6e0', '#ffe0e8', '#f9e0ea', '#f5d5e2'
        ];

        class Petal {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -30 - Math.random() * 80;
                this.size = 8 + Math.random() * 16;
                this.speedY = 0.6 + Math.random() * 2.2;
                this.speedX = -0.6 + Math.random() * 1.2;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.01 + Math.random() * 0.04;
                this.wobbleAmp = 0.3 + Math.random() * 1.2;
                this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
                this.opacity = 0.5 + Math.random() * 0.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.03;
                this.shape = Math.random();
            }
            update() {
                this.y += this.speedY;
                this.wobble += this.wobbleSpeed;
                this.x += this.speedX + Math.sin(this.wobble) * this.wobbleAmp;
                this.rotation += this.rotSpeed;
                if (this.y > canvas.height + 50) {
                    this.reset(false);
                    this.y = -30 - Math.random() * 40;
                    this.x = Math.random() * canvas.width;
                }
                if (this.x < -40) this.x = canvas.width + 30;
                if (this.x > canvas.width + 40) this.x = -30;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.shape < 0.55) {
                    ctx.ellipse(0, 0, this.size * 0.55, this.size * 0.3, 0, 0, Math.PI * 2);
                } else {
                    const s = this.size * 0.5;
                    ctx.moveTo(0, -s * 0.3);
                    ctx.bezierCurveTo(-s * 0.5, -s, -s, s * 0.3, 0, s);
                    ctx.bezierCurveTo(s, s * 0.3, s * 0.5, -s, 0, -s * 0.3);
                }
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.beginPath();
                ctx.ellipse(-this.size * 0.12, -this.size * 0.08, this.size * 0.15, this.size * 0.08,
                    0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxPetals; i++) {
            petals.push(new Petal());
        }

        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // ==================== 打字机效果（儿子口吻） ====================
        const lines = [
            { el: document.getElementById('line1'), text: '亲爱的妈妈，感谢您给予我生命，', speed: 55 },
            { el: document.getElementById('line2'), text: '用无尽的爱陪伴儿子走过每一个春夏秋冬。', speed: 50 },
            { el: document.getElementById('line3'), text: '在这个特别的日子里，我想对您说……', speed: 52 },
        ];

        let currentLineIndex = 0;
        let charIndex = 0;

        function typeNextChar() {
            if (currentLineIndex >= lines.length) return;
            const line = lines[currentLineIndex];
            if (charIndex < line.text.length) {
                line.el.textContent = line.text.substring(0, charIndex + 1);
                if (charIndex < line.text.length - 1) {
                    line.el.innerHTML = line.text.substring(0, charIndex + 1) +
                        '<span class="cursor"></span>';
                } else {
                    line.el.innerHTML = line.text.substring(0, charIndex + 1);
                }
                charIndex++;
                const delay = line.speed + (Math.random() - 0.5) * 30;
                setTimeout(typeNextChar, delay);
            } else {
                line.el.innerHTML = line.text;
                charIndex = 0;
                currentLineIndex++;
                if (currentLineIndex < lines.length) {
                    setTimeout(typeNextChar, 350);
                } else {
                    const lastEl = lines[lines.length - 1].el;
                    lastEl.innerHTML = lines[lines.length - 1].text +
                        '<span class="cursor" style="animation: cursorBlink 0.7s step-end infinite 3;"></span>';
                    setTimeout(() => {
                        lastEl.innerHTML = lines[lines.length - 1].text;
                    }, 2100);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeNextChar, 600);
        });

        function sendLove() {
            const btn = document.querySelector('.btn-primary');
            const originalText = btn.textContent;
            btn.textContent = '💗 儿子的拥抱已送达！';
            btn.style.background = 'linear-gradient(135deg, #f0b8cf, #e8879e)';
            btn.style.transform = 'scale(1.08)';
            burstPetals();
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = 'linear-gradient(135deg, #e8a0bf, #d4819b)';
                btn.style.transform = '';
            }, 2200);
        }

        function burstPetals() {
            const burstCount = 20;
            for (let i = 0; i < burstCount; i++) {
                const p = new Petal();
                p.x = canvas.width / 2 + (Math.random() - 0.5) * 200;
                p.y = canvas.height / 2 + (Math.random() - 0.5) * 100;
                p.speedY = -2 - Math.random() * 5;
                p.speedX = (Math.random() - 0.5) * 6;
                p.size = 10 + Math.random() * 18;
                p.opacity = 0.8;
                p.wobbleAmp = 1.5 + Math.random() * 2;
                petals.push(p);
                if (petals.length > maxPetals + 60) {
                    petals.shift();
                }
            }
        }

        function playMusic() {
            const audio = document.getElementById('bgMusic');
            const btn = document.querySelector('.btn-secondary');
            if (audio.paused) {
                audio.play().then(() => {
                    btn.innerHTML = '🎶 旋律播放中...';
                    btn.style.borderColor = '#d4819b';
                    btn.style.color = '#d4819b';
                }).catch(() => {
                    btn.innerHTML = '🔇 请点击页面后再试';
                    setTimeout(() => {
                        btn.innerHTML = '🎵 播放温馨旋律';
                        btn.style.borderColor = '#e8c0d0';
                        btn.style.color = '#c75b7a';
                    }, 1800);
                });
            } else {
                audio.pause();
                audio.currentTime = 0;
                btn.innerHTML = '🎵 播放温馨旋律';
                btn.style.borderColor = '#e8c0d0';
                btn.style.color = '#c75b7a';
            }
        }

        document.addEventListener('click', function autoPlayOnce() {
            const audio = document.getElementById('bgMusic');
            if (audio.paused && audio.currentTime === 0) {
                audio.play().catch(() => {});
            }
        }, { once: true });

        const card = document.getElementById('card');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -3;
            const rotateY = ((x - centerX) / centerX) * 3;
            card.style.transform =
                `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
            card.style.transition = 'transform 0.15s ease-out';
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0)';
            card.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1)';
        });

        console.log('%c🌸 母亲节快乐！%c 儿子祝天下所有妈妈都被时光温柔以待 💕',
            'font-size:22px;color:#c75b7a;', 'font-size:14px;color:#8b6b7a;');
        console.log('%c  妈，儿子永远爱您~ 记得给妈妈打个电话哦 📞',
            'font-size:13px;color:#b07a8c;');
    </script>
</body>
</html>
