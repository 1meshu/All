<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💐 母亲节快乐 - 致最爱的妈妈</title>
    <style>
        :root {
            --rose: #e8a0bf;
            --rose-dark: #c77d9f;
            --pink-light: #fce4ec;
            --cream: #fff9f5;
            --gold: #d4a574;
            --text: #5d3a4a;
            --text-light: #8b6b7a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', 'KaiTi', '楷体', 'SimSun', '宋体', serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #fdf2f7 0%, #fce4ec 25%, #f8d8e4 50%, #fdf2f7 75%, #fff5f0 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            cursor: default;
            position: relative;
        }

        /* 花瓣画布 */
        #petalsCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* 卡片 */
        .card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 50px 40px 45px;
            max-width: 620px;
            width: 100%;
            box-shadow:
                0 8px 40px rgba(180, 120, 140, 0.18),
                0 2px 12px rgba(180, 120, 140, 0.10),
                inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            text-align: center;
            animation: cardFloat 5s ease-in-out infinite;
            position: relative;
            overflow: visible;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 30px;
            right: 30px;
            height: 60px;
            border-radius: 30px 30px 0 0;
            background: linear-gradient(180deg, rgba(232, 160, 191, 0.25) 0%, transparent 100%);
            pointer-events: none;
            z-index: -1;
        }

        @keyframes cardFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
            60% {
                transform: translateY(-3px);
            }
        }

        /* 顶部装饰花束 */
        .flower-bouquet {
            font-size: 70px;
            line-height: 1;
            margin-bottom: 6px;
            animation: bouquetBounce 2.5s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 4px 12px rgba(200, 140, 160, 0.35));
        }
        @keyframes bouquetBounce {
            0%,
            100% {
                transform: translateY(0) scale(1);
            }
            20% {
                transform: translateY(-16px) scale(1.06);
            }
            40% {
                transform: translateY(0) scale(1);
            }
            55% {
                transform: translateY(-7px) scale(1.03);
            }
            70% {
                transform: translateY(0) scale(1);
            }
        }

        /* 标题 */
        .title {
            font-size: 2.6em;
            font-weight: bold;
            color: #c75b7a;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
            text-shadow: 0 2px 8px rgba(199, 91, 122, 0.2);
            line-height: 1.3;
        }
        .title .accent {
            color: #e8879e;
            font-size: 1.1em;
            display: inline-block;
            animation: heartPulse 1.3s ease-in-out infinite;
        }
        @keyframes heartPulse {
            0%,
            100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.18);
            }
            50% {
                transform: scale(1);
            }
            75% {
                transform: scale(1.1);
            }
        }

        .subtitle {
            font-size: 1.15em;
            color: #b07a8c;
            letter-spacing: 0.08em;
            margin-bottom: 28px;
            font-style: italic;
        }

        /* 分割线 */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 24px;
        }
        .divider .line {
            height: 1.5px;
            flex: 1;
            max-width: 90px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, #e8a0bf, transparent);
        }
        .divider .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #e8a0bf;
            opacity: 0.7;
        }

        /* 祝福正文 */
        .message {
            font-size: 1.2em;
            line-height: 2;
            color: #5d3a4a;
            letter-spacing: 0.04em;
            margin-bottom: 28px;
            text-align: center;
        }
        .message .highlight {
            color: #c75b7a;
            font-weight: bold;
            background: linear-gradient(180deg, transparent 60%, rgba(232, 160, 191, 0.25) 60%);
            padding: 0 4px;
            white-space: nowrap;
        }

        /* 打字机效果 */
        .typewriter-line {
            display: block;
            margin: 6px 0;
            color: #7a5565;
            font-size: 1.05em;
            letter-spacing: 0.05em;
            min-height: 1.6em;
        }
        .typewriter-line .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #c75b7a;
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: cursorBlink 0.7s step-end infinite;
        }
        @keyframes cursorBlink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* 散落小装饰 */
        .sparkle {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            animation: sparkleFloat 3s ease-in-out infinite;
            opacity: 0.7;
            z-index: 0;
        }
        @keyframes sparkleFloat {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.5;
            }
            50% {
                transform: translateY(-22px) rotate(18deg);
                opacity: 0.9;
            }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .card {
                padding: 35px 22px 30px;
                border-radius: 22px;
            }
            .title {
                font-size: 1.9em;
            }
            .flower-bouquet {
                font-size: 50px;
            }
            .message {
                font-size: 1.05em;
                line-height: 1.8;
            }
        }
    </style>
</head>
<body>

    <!-- 花瓣飘落画布 -->
    <canvas id="petalsCanvas"></canvas>

    <!-- 主内容 -->
    <div class="main-container">
        <div class="card" id="card">
            <!-- 散落小星星装饰 -->
            <span class="sparkle" style="top:8%;left:8%;animation-delay:0s;">✨</span>
            <span class="sparkle" style="top:12%;right:10%;animation-delay:0.8s;">🌸</span>
            <span class="sparkle" style="bottom:18%;left:12%;animation-delay:1.6s;">💫</span>
            <span class="sparkle" style="bottom:10%;right:14%;animation-delay:2.2s;">🌷</span>
            <span class="sparkle" style="top:40%;left:5%;animation-delay:0.4s;font-size:15px;">🌟</span>
            <span class="sparkle" style="top:45%;right:6%;animation-delay:2.8s;font-size:16px;">💖</span>

            <!-- 花束 -->
            <div class="flower-bouquet">💐</div>

            <!-- 标题 -->
            <h1 class="title">
                母亲节<span class="accent">❤️</span>快乐
            </h1>
            <p class="subtitle">—— 致世界上最好的妈妈 ——</p>

            <!-- 分割线 -->
            <div class="divider">
                <span class="line"></span><span class="dot"></span><span class="line"></span>
            </div>

            <!-- 祝福语 -->
            <div class="message">
                <span class="typewriter-line" id="line1"></span>
                <span class="typewriter-line" id="line2"></span>
                <span class="typewriter-line" id="line3"></span>
            </div>
            <p class="message" style="margin-top:4px;">
                <span class="highlight">妈妈，您辛苦了！</span><br>
                愿时光温柔，岁月长留<br>
                愿您永远健康、幸福、美丽 💕
            </p>
        </div>
    </div>

    <script>
        // ==================== 花瓣画布 ====================
        const canvas = document.getElementById('petalsCanvas');
        const ctx = canvas.getContext('2d');

        let petals = [];
        const maxPetals = 55;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            petals.forEach(p => {
                if (p.x > canvas.width) p.x = Math.random() * canvas.width;
                if (p.y > canvas.height) p.y = Math.random() * canvas.height;
            });
        });

        const petalColors = [
            '#f4c2d7', '#f8d4e4', '#fadde8', '#fbe8ef',
            '#e8a0bf', '#f0b8cf', '#fce4ec', '#fff0f3',
            '#ffd6e0', '#ffe0e8', '#f9e0ea', '#f5d5e2'
        ];

        class Petal {
            constructor() {
                this.reset(true);
            }
            reset(initial = false) {
                this.x = Math.random() * canvas.width;
                this.y = initial ? Math.random() * canvas.height : -30 - Math.random() * 80;
                this.size = 8 + Math.random() * 16;
                this.speedY = 0.6 + Math.random() * 2.2;
                this.speedX = -0.6 + Math.random() * 1.2;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.01 + Math.random() * 0.04;
                this.wobbleAmp = 0.3 + Math.random() * 1.2;
                this.color = petalColors[Math.floor(Math.random() * petalColors.length)];
                this.opacity = 0.5 + Math.random() * 0.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.03;
                this.shape = Math.random();
            }
            update() {
                this.y += this.speedY;
                this.wobble += this.wobbleSpeed;
                this.x += this.speedX + Math.sin(this.wobble) * this.wobbleAmp;
                this.rotation += this.rotSpeed;
                if (this.y > canvas.height + 50) {
                    this.reset(false);
                    this.y = -30 - Math.random() * 40;
                    this.x = Math.random() * canvas.width;
                }
                if (this.x < -40) this.x = canvas.width + 30;
                if (this.x > canvas.width + 40) this.x = -30;
            }
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.shape < 0.55) {
                    ctx.ellipse(0, 0, this.size * 0.55, this.size * 0.3, 0, 0, Math.PI * 2);
                } else {
                    const s = this.size * 0.5;
                    ctx.moveTo(0, -s * 0.3);
                    ctx.bezierCurveTo(-s * 0.5, -s, -s, s * 0.3, 0, s);
                    ctx.bezierCurveTo(s, s * 0.3, s * 0.5, -s, 0, -s * 0.3);
                }
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.35)';
                ctx.beginPath();
                ctx.ellipse(-this.size * 0.12, -this.size * 0.08, this.size * 0.15, this.size * 0.08,
                    0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < maxPetals; i++) {
            petals.push(new Petal());
        }

        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        // ==================== 打字机效果 ====================
        const lines = [
            { el: document.getElementById('line1'), text: '亲爱的妈妈，感谢您给予我生命，', speed: 55 },
            { el: document.getElementById('line2'), text: '用无尽的爱陪伴我走过每一个春夏秋冬。', speed: 50 },
            { el: document.getElementById('line3'), text: '在这个特别的日子里，我想对您说……', speed: 52 },
        ];

        let currentLineIndex = 0;
        let charIndex = 0;

        function typeNextChar() {
            if (currentLineIndex >= lines.length) return;
            const line = lines[currentLineIndex];
            if (charIndex < line.text.length) {
                line.el.textContent = line.text.substring(0, charIndex + 1);
                if (charIndex < line.text.length - 1) {
                    line.el.innerHTML = line.text.substring(0, charIndex + 1) +
                        '<span class="cursor"></span>';
                } else {
                    line.el.innerHTML = line.text.substring(0, charIndex + 1);
                }
                charIndex++;
                const delay = line.speed + (Math.random() - 0.5) * 30;
                setTimeout(typeNextChar, delay);
            } else {
                line.el.innerHTML = line.text;
                charIndex = 0;
                currentLineIndex++;
                if (currentLineIndex < lines.length) {
                    setTimeout(typeNextChar, 350);
                } else {
                    const lastEl = lines[lines.length - 1].el;
                    lastEl.innerHTML = lines[lines.length - 1].text +
                        '<span class="cursor" style="animation: cursorBlink 0.7s step-end 3;"></span>';
                    setTimeout(() => {
                        lastEl.innerHTML = lines[lines.length - 1].text;
                    }, 2100);
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(typeNextChar, 600);
        });

        // ==================== 卡片悬停微交互 ====================
        const card = document.getElementById('card');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -3;
            const rotateY = ((x - centerX) / centerX) * 3;
            card.style.transform =
                `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px)`;
            card.style.transition = 'transform 0.15s ease-out';
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg) translateY(0)';
            card.style.transition = 'transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1)';
        });

        // ==================== 控制台彩蛋 ====================
        console.log('%c🌸 母亲节快乐！%c 愿天下所有妈妈都被时光温柔以待 💕',
            'font-size:22px;color:#c75b7a;', 'font-size:14px;color:#8b6b7a;');
        console.log('%c  感谢您打开这个页面，记得给妈妈打个电话哦~ 📞',
            'font-size:13px;color:#b07a8c;');
    </script>
</body>
</html>
